<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tung Tung Client 1.7.0 — all page previews</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#000;color:#f2ebe1;font:14px "Segoe UI",Arial,sans-serif;width:1600px}h1{font-size:28px;margin:0 0 9px}p{color:#93897d;margin:0 0 25px}.grid{display:grid;grid-template-columns:760px 760px;gap:26px 20px}section{width:760px}h2{font-size:15px;color:#c89155;font-weight:500;margin:0 0 10px}img{display:block;width:760px;height:auto;border:1px solid #322518;border-radius:8px}</style></head><body><h1>Tung Tung Client 1.7.0</h1><p>Every page · Offline visual previews · Rendered in Chrome, not Windows runtime screenshots</p><main class="grid" id="pages"></main><script src="pages.js"></script><script>document.querySelector('#pages').innerHTML=PREVIEW_PAGES.map(({id,title},i)=>`<section><h2>${String(i+1).padStart(2,'0')} · ${title}</h2><img src="screenshots/${id}.png" alt="${title}: offline visual preview"></section>`).join('');</script></body></html>
