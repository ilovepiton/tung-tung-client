plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
base { archivesName = 'tung-tung-bridge' }
repositories { mavenCentral() }

sourceSets {
    mapInSlotPatch {
        java.srcDir 'src/mapInSlotPatch/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.named('compileMapInSlotPatchJava') { dependsOn tasks.named('compileJava') }

tasks.register('mapInSlotPatchedJar', Jar) {
    dependsOn tasks.named('compileMapInSlotPatchJava')
    archiveFileName = 'map-in-slot-3.5.0-tuntun.jar'
    destinationDirectory = file('.tools/map-art')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree('.tools/map-art/map-in-slot-3.5.0.jar')) {
        exclude 'dev/crec/mapinslot/mixin/ItemRendererMixin.class'
    }
    from sourceSets.mapInSlotPatch.output
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Compile the optional Simple Voice Chat integration without bundling the mod.
    compileOnly files('.tools/voicechat-fabric-2.6.27+26.3.jar')
    // User-supplied MIT client map add-ons stay separate from the core JAR.
    runtimeOnly files('.tools/map-art/client_maps-1.3.4.jar')
    runtimeOnly files('.tools/map-art/map-in-slot-3.5.0-tuntun.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    exclude '**/.DS_Store'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
test {
    dependsOn tasks.named('mapInSlotPatchedJar')
    useJUnitPlatform()
}
tasks.register('farmChecks', JavaExec) {
    dependsOn testClasses, tasks.named('mapInSlotPatchedJar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.amethyst.finder.modules.FarmChecks'
    enableAssertions = true
}
tasks.register('searchChunkChecks', JavaExec) {
    dependsOn testClasses, tasks.named('mapInSlotPatchedJar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.amethyst.finder.ui.SearchChunkChecks'
    enableAssertions = true
}
tasks.named('check') {
    dependsOn tasks.named('farmChecks'), tasks.named('searchChunkChecks')
}
jar { from('LICENSE') { rename { 'LICENSE_amethyst-chunk-finder' } } }
tasks.named('runClient') { dependsOn tasks.named('mapInSlotPatchedJar') }
tasks.named('build') { dependsOn tasks.named('mapInSlotPatchedJar') }

